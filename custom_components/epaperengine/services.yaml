get_render_data:
  fields: {}

report_run:
  fields:
    result:
      required: true
      example: pushed
      selector:
        select:
          options:
            - idle
            - pushed
            - unchanged
            - push_failed
            - push_off
            - render_failed
    view:
      required: true
      example: photos
      selector:
        select:
          options:
            - calendar
            - recipes
            - photos
            - guests
            - error
    error:
      example: Chromium exited with code 1
      selector:
        text:
    warning:
      example: calendar source unavailable
      selector:
        text:
    image_hash:
      example: 9f0df4e2c1
      selector:
        text:
    pushed:
      default: false
      selector:
        boolean:

render:
  fields:
    force:
      default: false
      selector:
        boolean:

set_view:
  fields:
    view:
      example: recipes
      selector:
        select:
          options:
            - calendar
            - recipes
            - photos
            - guests
            - error

sync_recipes:
  fields: {}

set_guests:
  fields:
    active:
      required: true
      example: true
      selector:
        boolean:

sync_anniversaries:
  fields:
    dry_run:
      default: true
      selector:
        boolean:
    limit:
      example: 1
      selector:
        number:
          min: 0
          max: 1000
          mode: box

sync_calendars:
  fields:
    dry_run:
      default: true
      selector:
        boolean:
